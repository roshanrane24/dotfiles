# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
windowrule {
    name = KDEPopuoFloat
    float = on
    match:class = (org.freedesktop.impl.portal.desktop.kde)
}
#windowrulev2 = float,class:(MultiViewer)
windowrule {
    name = SounDControlFloat
    float = on
    pin = on
    size = 70% 80%
    match:class = ^.*(pavucontrol).*$
}
