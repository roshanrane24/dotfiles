# }
#windowrule {
#    name =
#    pin = on,
#    match:class = ^.*(pavucontrol).*$
#}
windowrule {
    name = NetworkManagerFlaot
    float = on
    match:class = nm-connection-editor
}
windowrule {
    name = Kitty
    workspace = 1
    match:class = kitty
}
windowrule {
    name = Zen
    workspace = 2
    match:class = zen
}
windowrule {
    name = Brave
    workspace = 2
    match:class = brave-browser
}
windowrule {
    name = Whatsapp
    workspace = 6
    match:class = ^brave.*,title:WhatsApp\sWeb
}
windowrule {
    name = Dolphin
    workspace = 3
    match:class = org.kde.dolphin
}
windowrule {
    name = Nautilus
    workspace = 3
    match:class = org.gnome.Nautilus
}
windowrule {
    name = Spotify
    workspace = 4
    match:class = Spotify
}
windowrule {
    name = F1-Main
    workspace = special:f1
    match:class = (MultiViewer)
}
windowrule {
    name = F1-Timing
    workspace = special:magic
    match:title = (Live Timing — MultiViewer)
}

# Ignore maximize requests from apps. You'll probably like this.
windowrule {
    name = Ignore-maximize-request
    suppress_event = maximize
    match:class = .*
}

# Fix some dragging issues with XWayland
windowrule {
    name = xwayland-dragging-issue
    no_focus = on 
    match:class = ^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
}
