# For more information visit https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/
$scrPath      = ~/.config/hypr/hyprlock
$userImg      = ~/.config/user.jpg

source = $HOME/.config/hypr/hyprlock/colors.conf

# WALLPAPER
# Just comment and uncomment to select
$blur  = 1
$wallpaper = ~/.config/waypaper/wall

# ADJUST HERE
$rounding     = 12
$shape-rd     = -1
$font-text    = SpaceMono Nerd Font Bold
$font-text0   = SpaceMono Nerd Font Regular
$font-display = SpaceMono Nerd Font Bold
$font-symbol  = SapceMono Nerd Font Mono

# Input Var
$weight       = 1
$inner-color  = rgba(12, 12, 12, 0.8)
$border-color = rgba(255, 255, 255, 0.15)

# Colors
$clock-color  = rgba(255, 255, 255, 0.8)
$fg0          = rgba(255, 255, 255, 0.8)
$fg1          = rgba(225, 225, 225, 0.8)
$shape-col0   = rgba(255, 255, 255, 1)
$shape-col1   = rgba(110, 0, 0, 0.25)
$shape-col2   = rgba(255, 255, 255, 0.25)
$shadow_pass  = 2
$shadow-size  = 3
$shadow-color = $shadow
$shadow-boost = 1.2
$text-shadow-pass   = 1
$text-shadow-boost  = 0.5

# GENERAL
general {
    hide_cursor         = false
    ignore_empty_input  = true
    text_trim           = true
}

# BACKGROUND (Highlight widgets from video)
background {
    color               = rgba(11, 111, 11, 0)
    blur_passes         = 0
    blur_size           = 7
}

# PROFILE PICTURE
image {
    path                = $userImg
    size                = 180 # lesser side if not 1:1 ratio
    shadow_size         = 30
    shadow_color        = $shadow-color
    shadow_boost        = $shadow-boost
    rounding            = -1# negative values mean circle
    border_size         = 3
    rotate              = 0 # degrees, counter-clockwise
    position            = 0, 0
    halign              = center
    valign              = center
    zindex              = 5
}

