# GREETING
label {
    text                = cmd[update:60000] echo "$(bash $scrPath/greeting.sh $USER)"
    shadow_passes       = $text-shadow-pass
    shadow_boost        = $text-shadow-boost
    color               = $fg0
    font_size           = 20
    font_family         = $font-text0
    position            = 0, -9%
    halign              = center
    valign              = center
}

# INPUT FIELD
input-field {
    size                = 12%, 5%
    rounding            = $rounding
    outline_thickness   = $weight
    inner_color         = $inner-color
    outer_color         = $border-color
    dots_size           = 0.08 # Scale of input-field height, 0.2 - 0.8
    dots_spacing        = 0.1 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center         = false
    dots_text_format    = <span> </span>
    font_color          = $fg0
    fade_on_empty       = true
    fade_timeout        = 5000
    font_family         = $font-text
    placeholder_text    = <span>󰌾 Password</span>
    hide_input          = false
    position            = 0, -15%
    halign              = center
    valign              = center
    zindex              = 10
}

# TIME
label {
    text                = cmd[update:1000] date +"%H:%M" # 24-Hour Format
    color               = $clock-color
    #shadow_pass         = $shadow_pass
    shadow_size         = $shadow-size
    shadow_color        = $shadow-color
    shadow_boost        = $shadow-boost
    font_family         = $font-display
    font_size           = 200
    position            = 0, -5%
    halign              = center
    valign              = top
}

# Date
label {
    text                = cmd[update:0] date +"%A, %d %b %Y" # Day, Date Month Year
    color               = $clock-color
    #shadow_pass         = $shadow_pass
    shadow_size         = $shadow-size
    shadow_color        = $shadow-color
    shadow_boost        = $shadow-boost
    font_family         = SpaceMono Nerd Font Regular
    font_size           = 45
    position            = 0, -27%
    halign              = center
    valign              = top
}


