### PROGRAMS/VARIABLES ###

$scriptPath = $HOME/.config/shell-files
$mainMod = super
$altMod = alt
$key = tab
$reverse = grave
$terminal = ghostty
$fileManager = dolphin
$fileManager2 = nautilus
$browser = zen-browser
$browser2 = brave
$menu = rofi -show-icons -show drun -matching fuzzy -run-command "uwsm app -- {cmd}" -modi drun
$menuWindows = rofi -show-icons -show window -matching fuzzy -modi window
$monitor1 = DP-3
### ENVIRONMENT VARIABLES ###
source = ~/.config/hypr/hypr-environment.conf

### Monitors ##
source = ~/.config/hypr/hypr-monitors.conf

### AUTOSTART ###
source = ~/.config/hypr/hypr-autostart.conf

### PLUGINS ###
source = ~/.config/hypr/hypr-plugins.conf

### ANIMATIONS ###
source = ~/.config/hypr/hypr-animations.conf

### WINDOW ###
source = ~/.config/hypr/hypr-window.conf

### WINDOW RULES ###
source = ~/.config/hypr/hypr-wrules.conf

### DECORATION ###
source = ~/.config/hypr/hypr-decoration.conf

### KEYBINDS ###
source = ~/.config/hypr/hypr-keybinds.conf

### LAYOUTS ###
source = ~/.config/hypr/hypr-layouts.conf

### INPUTS ###
source = ~/.config/hypr/hypr-inputs.conf

### MISC ###
source = ~/.config/hypr/hypr-misc.conf

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = rounding 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]
# windowrulev2 = rounding 0, floating:0, onworkspace:f[1]
