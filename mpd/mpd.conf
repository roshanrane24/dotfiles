# An example of a pipewire output:                                           
audio_output {                                                                 
    type     "pipewire"                                                       
    name     "PipeWire Sound Server"                                           
    enabled  "no"                                                             
}                                                                             
#                                                                             
## An example of a local pulseaudio output:                                   
audio_output {                                                                 
    type     "pulse"                                                           
    name     "Local PulseAudio Server"                                         
    enabled  "yes"                                                             
}
